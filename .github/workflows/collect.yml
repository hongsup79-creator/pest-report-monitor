name: 병해충 신규보고 수집

on:
  schedule:
    - cron: "17 21 * * *"   # 매일 한국시간 06:17
  workflow_dispatch:
    inputs:
      days:
        description: "수집 기간(일). 초기 수집은 365"
        default: "7"
        required: false

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 패키지 설치
        run: pip install -r requirements.txt pytest

      - name: 태깅 시험
        run: python -m pytest -q tests/

      - name: 수집 실행
        env:
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
        run: python collect.py --days "${{ github.event.inputs.days || '7' }}"

      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "데이터 갱신 $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
